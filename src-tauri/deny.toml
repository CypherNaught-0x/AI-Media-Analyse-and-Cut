# cargo-deny policy for the Rust dependency tree (`cargo deny check`).
#
# This covers crates only. What the app downloads at runtime (model weights,
# the CrisperWhisper Python package, FFmpeg) is not a crate; its licences are
# registered and policy-checked in src/assets/runtime-licenses.json.

[graph]
all-features = false

[advisories]
# Advisories fail the check; unmaintained crates are reported for direct
# dependencies only, because the transitive ones come from Tauri's platform
# stacks and can't be replaced here. Ignores need a reason.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, plus file-level copyleft MPL-2.0 (cssparser/selectors
# via Tauri, symphonia audio decoding), which is compatible with shipping an
# MIT application.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in the Tauri tree and not actionable here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
