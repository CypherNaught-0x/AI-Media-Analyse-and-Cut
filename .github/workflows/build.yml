name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'app-v*'
  pull_request:
    branches:
      - main
  # Manual runs can opt into the real-API pipeline tests, which cost money and
  # depend on an external service, so they never run on ordinary pushes.
  workflow_dispatch:
    inputs:
      real_api_tests:
        description: 'Run the real-API pipeline tests (uses the API_* secrets)'
        type: boolean
        default: false

jobs:
  # Fast, platform-independent gate: lint, types, formatting and all tests.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev pkg-config build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Type-check (app and specs)
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test -- --run

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Dependency policy (licences, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

      - name: Backend tests
        working-directory: src-tauri
        env:
          API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.real_api_tests && secrets.API_KEY || '' }}
          BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.real_api_tests && secrets.BASE_URL || '' }}
          API_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.real_api_tests && secrets.API_MODEL || '' }}
        run: cargo test

  # Platform builds. Bundles are uploaded as artifacts for every run; the
  # (draft) GitHub release is only created for app-v* tags.
  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev pkg-config build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ffmpeg

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Platform-specific behaviour (process control, ffmpeg) is covered here;
      # everything platform-independent already ran in the check job.
      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Build App
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # With tagName and releaseName empty, tauri-action only builds and
          # creates no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && 'app-v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/app-v') && 'App v__VERSION__' || '' }}
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: warn
