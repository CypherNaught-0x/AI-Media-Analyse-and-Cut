# Git hooks (https://lefthook.dev). Installed by `pnpm install`.
# Skip once with `LEFTHOOK=0 git commit ...`; `just check` runs everything.

# Fast checks on the staged files only. They never modify files, so a
# partially staged file can't pick up unstaged changes.
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,js,mjs,vue,css,html,json}"
      run: pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern {staged_files}
    - name: eslint
      glob: "*.{ts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: rustfmt
      glob: "src-tauri/**/*.rs"
      root: "src-tauri/"
      run: cargo fmt --check

# Slower whole-project checks before code leaves the machine.
pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: frontend-tests
      run: pnpm test -- --run
    - name: clippy
      root: "src-tauri/"
      run: cargo clippy --all-targets -- -D warnings
